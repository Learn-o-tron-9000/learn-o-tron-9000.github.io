<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 03: Dashboard Layout Scaffold</title>
  <link rel="stylesheet" href="dashboard-layout.css">
</head>
<body>

  <div class="dashboard">
    <header class="dashboard__header">
      <p class="zone-label">Header — Control Bar</p>
    </header>

    <nav class="dashboard__nav" aria-label="Primary navigation">
      <p class="zone-label">Nav — Primary Navigation</p>
    </nav>

    <main class="dashboard__main">
      <p class="zone-label">Main — Workspace</p>
    </main>

    <aside class="dashboard__aside" aria-label="Context drawer">
      <p class="zone-label">Aside — Context Drawer</p>
    </aside>

    <footer class="dashboard__footer">
      <p class="zone-label">Footer — Status Readout</p>
    </footer>
  </div>

</body>
</html>
